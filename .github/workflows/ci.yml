name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lean on purpose: private repo on the free plan. No artifact uploads here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt's system libraries (widget tests run offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install test tools
        run: pip install "PySide6>=6.8" "pytest>=8" "pytest-qt>=4.4" "ruff>=0.6"
      - name: Lint
        run: ruff check src tests hook
      - name: Test
        run: pytest
