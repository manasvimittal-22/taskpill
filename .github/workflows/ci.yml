name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lean on purpose: private repo on the free plan. No artifact uploads here.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt's system libraries (widget tests run offscreen)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install test tools
        run: pip install "PySide6>=6.8" "pytest>=8" "pytest-qt>=4.4" "ruff>=0.6"
      - name: Lint
        run: ruff check src tests hook
      - name: Test
        run: pytest

  # The whole suite on a real Mac, including tests/platform/test_macos_real.py (the real
  # macOS APIs). Public repo only: macOS minutes are free there, and cost 10x here.
  # Added 2026-11-22 after GitHub's Mac found a crash the fakes couldn't.
  macos:
    if: github.repository == 'manasvimittal-22/taskpill'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test (on a real Mac)
        run: python -m pytest
