name: Release

# Runs only when a version tag is pushed (e.g. `git tag v0.1.0 ; git push origin v0.1.0`).
# Builds the Windows installer, the portable .zip and the macOS .dmg and attaches them to a
# GitHub Release. (The VS Code
# extension is on hold since 2026-11-17, so it isn't built or attached.) Release files don't use Actions storage; nothing is uploaded as
# an Actions artifact.
on:
  push:
    tags: ["v*"]
  # By hand (Actions → Release → Run workflow): build only the macOS .dmg for a release
  # that already exists, from that tag's code. Added after v0.2.0's Mac job couldn't
  # start (GitHub had retired the macos-14 runner), 2026-11-22.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build the .dmg for (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the app version
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0, 'src'); import taskpill; print(taskpill.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} doesn't match version $version" }

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test
        run: python -m pytest

      - name: Make sure Inno Setup is there
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build the installer
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each file gets a label on the release page (file#label), and the notes start
          # with "Which file do I download?" (.github/release-notes.md).
          $installer = (Get-ChildItem dist\TaskPill-Setup-*-Windows.exe).FullName
          $portable = (Get-ChildItem dist\TaskPill-*-Windows-Portable.zip).FullName
          gh release create "${{ github.ref_name }}" `
            "$installer#Windows: installer (recommended)" `
            "$portable#Windows: portable zip, no install" `
            --title "TaskPill ${{ github.ref_name }}" `
            --notes-file .github/release-notes.md --generate-notes

  # macOS (Phase 5, 2026-11-22): runs after the Windows job has created the release.
  # Apple Silicon only. Every test runs here on a real Mac, including
  # tests/platform/test_macos_real.py, which calls the real macOS APIs (they're
  # skipped on Windows and Linux). A failure stops the .dmg from being published.
  macos:
    needs: windows
    # After the Windows job made the release, or by hand for an existing tag.
    if: ${{ always() && (needs.windows.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest  # Apple Silicon. A fixed version (macos-14) was retired under us.
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e ".[dev,build]"

      - name: Test (on a real Mac)
        run: python -m pytest

      - name: Build the app and the .dmg
        run: sh packaging/build_macos.sh

      - name: Attach the .dmg to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls dist/TaskPill-*-Mac-AppleSilicon.dmg)
          gh release upload "$TAG" "$DMG#Mac: Apple Silicon, M1 or newer (.dmg)" --clobber
